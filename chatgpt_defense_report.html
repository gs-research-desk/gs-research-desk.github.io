</style><!--gs-gate--><script>
(function(){
 var OH="4c9b36a88f5d4509867ff909411501386428b8785635c8d759e34742792dda86",GH="d17e494562f94f74f2a7d0397c1138f2524bd9ed47860e82f639334dab1b476a",OWNER=false,SALT="GS-DB2|",K="gs_gate_v1",MS=30*864e5;
 // 저장된 값에서 등급을 읽는다: 주인이면 'owner', 친구면 'guest', 없거나 만료면 null.
 function level(){try{var v=JSON.parse(localStorage.getItem(K)||"null");
   if(!v||Date.now()-v.t>=MS)return null;
   return v.h===OH?"owner":v.h===GH?"guest":null}catch(e){return null}}

 async function digest(s){

   return [].map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,"0")}).join("")}

 if(!(window.crypto&&crypto.subtle))return;
 var de=document.documentElement;de.style.visibility="hidden";  // 그려지기 전에 가림

   // 문서는 계속 숨긴 채 가림막만 보이게 둔다(내용이 아예 안 그려진다).

   document.body.appendChild(w);

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>방산 브리핑 RSS판</title><style>

body{margin:0;padding:28px 24px 60px;background:var(--gs-bg,#161a21);color:var(--gs-ink,#c9d1dc);
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;line-height:1.85;font-size:16.5px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:23px;color:var(--gs-ink-strong,#e6ebf2);margin:0 0 4px}
.meta{color:var(--gs-muted,#8e98a8);font-size:13.5px;margin-bottom:22px}
h2{font-size:18px;color:var(--gs-accent,#d6b27a);margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--gs-line,#232e3f)}
a{color:var(--gs-link,#89b9ff);text-decoration:none}a:hover{text-decoration:underline}
b,strong{color:var(--gs-ink-strong,#e6ebf2)}
ul{margin:10px 0;padding-left:24px}
p{margin:11px 0}
hr{border:none;border-top:1px solid var(--gs-line,#232e3f);margin:20px 0}
table.ptab{border-collapse:collapse;width:100%;min-width:560px;margin:14px 0;font-size:14.5px}
.ptab td{white-space:nowrap}.ptab td:first-child{white-space:normal;min-width:130px}.ptab td:last-child{white-space:normal;min-width:200px}
.ptab td{border-bottom:1px solid var(--gs-line-soft,#1f2834);padding:7px 9px;text-align:left;vertical-align:top}
.ptab tr:first-child td{color:var(--gs-muted,#8e98a8);font-size:13px;border-bottom:1px solid var(--gs-line-strong,#2e3a4e)}
.ptab tr:hover td{background:var(--gs-hover,#1e2531)}
.up{color:var(--gs-up,#ff7b7b);font-weight:600}
.down{color:var(--gs-down,#6ca6ff);font-weight:600}
/* 모바일: 6열 표가 세로로 짓눌리므로 행을 카드로 재배치 (헤더행 기반 라벨) */
@media (max-width:640px){
  body{padding:20px 14px 48px}
  .ptab.hdr, .ptab.hdr tbody, .ptab.hdr tr, .ptab.hdr td{display:block;width:100%;box-sizing:border-box}
  .ptab.hdr tr:first-child{display:none}
  .ptab.hdr tr{border:1px solid var(--gs-line,#232e3f);border-radius:10px;margin:10px 0;padding:9px 12px;background:var(--gs-card,#1a2029)}
  .ptab.hdr tr:hover td{background:transparent}
  .ptab.hdr td{border:none;padding:2px 0;display:flex;gap:10px;align-items:baseline;font-size:14.5px}
  .ptab.hdr td::before{content:attr(data-l);color:var(--gs-muted,#8e98a8);font-size:11.5px;flex:0 0 58px}
  .ptab.hdr td:first-child{display:block;font-weight:700;color:var(--gs-ink-strong,#e6ebf2);font-size:15.5px;
    padding-bottom:5px;margin-bottom:4px;border-bottom:1px solid var(--gs-line-soft,#1f2834)}

.bar{display:flex;gap:10px;align-items:center;max-width:860px;margin:0 auto 10px;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;flex:1;min-width:200px}
select,button{background:var(--gs-panel,#1c222c);color:var(--gs-ink,#c9d1dc);border:1px solid var(--gs-line-strong,#2e3a4e);border-radius:8px;
  padding:7px 12px;font-size:13.5px;cursor:pointer}
iframe{width:100%;height:calc(100vh - 150px);border:1px solid var(--gs-line,#232e3f);border-radius:10px;background:var(--gs-bg,#161a21)}
details.paste{max-width:860px;margin:0 auto 12px;border:1px solid var(--gs-line,#232e3f);border-radius:10px;background:var(--gs-card,#1a2029)}
details.paste summary{cursor:pointer;padding:9px 14px;color:var(--gs-accent,#d6b27a);font-size:13.5px}
.paste-body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.paste-body textarea{width:100%;box-sizing:border-box;min-height:180px;background:var(--gs-bg,#161a21);color:var(--gs-ink,#c9d1dc);
  border:1px solid var(--gs-line-strong,#2e3a4e);border-radius:8px;padding:10px;font-size:13px;font-family:inherit;line-height:1.6}
.paste-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.paste-row input[type=date]{background:var(--gs-panel,#1c222c);color:var(--gs-ink,#c9d1dc);border:1px solid var(--gs-line-strong,#2e3a4e);border-radius:8px;padding:6px 10px}

</style></head><body>
<div class="bar">
  <h1>🧠 글로벌 방산 브리핑 (RSS판)</h1>
  <button id="prev" title="이전 날짜">◀</button>
  <select id="dsel"></select>
  <button id="next" title="다음 날짜">▶</button>
</div>
<details class="paste">
  <summary>✍️ ChatGPT 앱 브리핑 직접 등록 (자동 생성보다 우선 적용)</summary>
  <div class="paste-body">
    <div class="paste-row">
      <label for="p-date" style="font-size:12.5px;color:var(--gs-muted,#8e98a8)">브리핑 날짜</label>
      <input id="p-date" type="date">
      <button id="p-btn" onclick="submitBrief()">발행 → 대시보드</button>
    </div>
    <textarea id="p-md" placeholder="ChatGPT가 만든 브리핑 마크다운 전문을 그대로 붙여넣으세요"></textarea>
    <p id="paste-status"></p>
    <p class="hint">같은 날짜로 다시 등록하면 그 날짜 페이지가 새 내용으로 교체됩니다.
    텔레그램은 통합본 한 통만 방산 채널로 나갑니다(개별 판 발송 없음).
    붙여넣기가 안 되는 환경에서는 리포의 <code>chatgpt_briefing/inbox/YYYY-MM-DD.md</code> 파일로 올려도 됩니다.</p>
  </div>
</details>
<iframe id="frame" title="브리핑"></iframe>
<script>
const DATES=["2026-10-31", "2026-10-30", "2026-10-29", "2026-10-28", "2026-10-27", "2026-10-26", "2026-10-25", "2026-10-24", "2026-10-23", "2026-10-22", "2026-10-21", "2026-10-20", "2026-10-19", "2026-10-18", "2026-10-17", "2026-10-16", "2026-10-15", "2026-10-14", "2026-10-13", "2026-10-12", "2026-10-11", "2026-10-10", "2026-10-09", "2026-10-08", "2026-10-07", "2026-10-05", "2026-10-04", "2026-10-03", "2026-10-02", "2026-10-01", "2026-09-30", "2026-09-29", "2026-09-28", "2026-09-27", "2026-09-26", "2026-09-25", "2026-09-24", "2026-09-23", "2026-09-22", "2026-09-21", "2026-09-20", "2026-09-19", "2026-09-18", "2026-09-17"];
const EP="https://script.google.com/macros/s/AKfycbx3RjIjtlO2Z6fIYo2T3LhJrFg9Wp2hS7dMS3Is52-JVF1hizoCWewbQ1uM_v5sdhR2jw/exec";
const sel=document.getElementById('dsel'),fr=document.getElementById('frame');
DATES.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d+' ('+'일월화수목금토'[new Date(d+'T00:00:00').getDay()]+')';sel.appendChild(o)});
function load(){fr.src='chatgpt_defense/'+sel.value+'.html'}
sel.onchange=load;
document.getElementById('prev').onclick=()=>{if(sel.selectedIndex<DATES.length-1){sel.selectedIndex++;load()}};
document.getElementById('next').onclick=()=>{if(sel.selectedIndex>0){sel.selectedIndex--;load()}};
if(DATES.length)load();
else fr.srcdoc='<body style="background:var(--gs-bg,#161a21);color:var(--gs-muted,#8e98a8);font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">아직 브리핑이 없습니다 — 매일 아침 자동 생성되며, ✍️ 폼으로 ChatGPT 앱 브리핑을 직접 등록할 수도 있습니다.</body>';
document.getElementById('p-date').value=new Date().toLocaleDateString('sv');
async function submitBrief(){
  const btn=document.getElementById('p-btn'),st=document.getElementById('paste-status');
  const date=document.getElementById('p-date').value,md=document.getElementById('p-md').value.trim();
  if(!md){st.textContent='⚠ 본문이 비어 있습니다';return}
  if(!date){st.textContent='⚠ 날짜를 선택하세요';return}
  btn.disabled=true;st.textContent='전송 중…';
  try{
    const r=await fetch(EP,{method:'POST',body:JSON.stringify({workflow:'gptbrief',date:date,content:md})});
    try{const d=await r.json();
      if(d&&d.ok===false){st.textContent='⚠ 거절 '+(d.code||'?')+' — '+(d.error||'GAS 프록시 확인 필요');btn.disabled=false;return}
    }catch(e){}
    document.getElementById('p-md').value='';
    const isNew=!DATES.includes(date);
    st.textContent='✅ 접수됨 — 페이지 생성·배포에 2~4분, 텔레그램은 곧 도착합니다.'+(isNew?' 새 날짜가 뜨면 자동 새로고침합니다.':' (같은 날짜 재등록 — 잠시 후 직접 새로고침하세요)');
    if(isNew){
      let n=0;const t=setInterval(async()=>{
        n++;if(n>20){clearInterval(t);return}
        try{const h=await fetch('chatgpt_defense/'+date+'.html',{method:'HEAD',cache:'no-store'});
          if(h.ok){clearInterval(t);location.reload()}}catch(e){}
      },20000);
    }
  }catch(e){st.textContent='실패: '+e.message;btn.disabled=false}
}
</script><script>
(function(){
 var K="gs_theme",ORDER=["auto","light","dark"],
     ICON={auto:"\u25D1",light:"\u2600",dark:"\u263D"},
     NAME={auto:"\uC2DC\uC2A4\uD15C \uC124\uC815\uC744 \uB530\uB984",
           light:"\uBC1D\uAC8C \uACE0\uC815",dark:"\uC5B4\uB461\uAC8C \uACE0\uC815"};
 function get(){try{var v=localStorage.getItem(K);return ORDER.indexOf(v)>=0?v:"auto"}catch(e){return "auto"}}
 function apply(v){
   var de=document.documentElement;
   if(v==="auto")de.removeAttribute("data-gs-theme");else de.setAttribute("data-gs-theme",v);
   var b=document.getElementById("gs-theme-btn");
   if(b){b.textContent=ICON[v];b.title="\uD654\uBA74 \uBC1D\uAE30: "+NAME[v]+" (\uB20C\uB7EC\uC11C \uBC14\uAFC8)";}
 }
 apply(get());                       // 그려지기 전에 테마부터 맞춘다
 // 다른 탭·부모 창에서 바꾸면 이 문서도 따라간다(iframe 포함)
 window.addEventListener("storage",function(e){if(e.key===K)apply(get())});
 function mount(){
   if(window.self!==window.top)return;   // iframe 안에서는 버튼을 안 만든다
   var b=document.createElement("button");
   b.id="gs-theme-btn";b.type="button";b.setAttribute("aria-label","\uD654\uBA74 \uBC1D\uAE30 \uBC14\uAFC8");
   b.onclick=function(){
     var v=ORDER[(ORDER.indexOf(get())+1)%ORDER.length];
     try{localStorage.setItem(K,v)}catch(e){}
     apply(v);
   };
   document.body.appendChild(b);apply(get());
 }
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mount);
 else mount();
})();
</script></body></html>
