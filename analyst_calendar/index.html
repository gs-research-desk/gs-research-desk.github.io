<!doctype html>
<html lang="ko">
<head><!--gs-gate--><script>
(function(){
 var OH="4c9b36a88f5d4509867ff909411501386428b8785635c8d759e34742792dda86",GH="d17e494562f94f74f2a7d0397c1138f2524bd9ed47860e82f639334dab1b476a",OWNER=false,SALT="GS-DB2|",K="gs_gate_v1",MS=30*864e5;
 // 저장된 값에서 등급을 읽는다: 주인이면 'owner', 친구면 'guest', 없거나 만료면 null.
 function level(){try{var v=JSON.parse(localStorage.getItem(K)||"null");
   if(!v||Date.now()-v.t>=MS)return null;
   return v.h===OH?"owner":v.h===GH?"guest":null}catch(e){return null}}
 function set(h){try{localStorage.setItem(K,JSON.stringify({h:h,t:Date.now()}))}catch(e){}}
 async function digest(s){
   var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
   return [].map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,"0")}).join("")}
 var lv=level();
 if(lv==="owner")return;                 // 주인은 전부 통과
 if(lv==="guest"&&!OWNER)return;         // 친구는 공유 페이지만 통과
 // crypto.subtle 은 https/localhost 에서만 있다. 없으면(평문 http·file://) 대조가
 // 불가능하므로 잠그지 않고 통과시킨다 — 못 들어가게 막는 것보다 낫다.
 if(!(window.crypto&&crypto.subtle))return;
 var de=document.documentElement;de.style.visibility="hidden";  // 그려지기 전에 가림
 function show(){
   // 문서는 계속 숨긴 채 가림막만 보이게 둔다(내용이 아예 안 그려진다).
   var w=document.createElement("div");
   w.setAttribute("style","visibility:visible;position:fixed;inset:0;z-index:2147483647;background:#f7f7f5;"+
     "display:flex;align-items:center;justify-content:center;padding:24px;"+
     "font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif");
   w.innerHTML='<form style="background:#fff;border:1px solid #ededeb;border-radius:12px;'+
     'padding:28px 26px;width:min(340px,100%);box-shadow:0 10px 40px rgba(17,24,39,.08)">'+
     '<div style="font-size:13px;letter-spacing:.12em;color:#9ca3af;font-weight:700">GS RESEARCH DESK</div>'+
     '<h1 style="margin:6px 0 6px;font-size:20px;font-weight:800;color:#111827">비밀번호를 넣어 주세요</h1>'+
     '<p style="margin:0 0 15px;font-size:12.5px;color:#6b7280;line-height:1.5">'+
     '비밀번호는 <b style="color:#374151">GS최</b> 님에게 문의하세요.</p>'+
     '<input type="password" autocomplete="current-password" autofocus '+
     'style="width:100%;box-sizing:border-box;border:1px solid #ededeb;border-radius:8px;'+
     'padding:12px 13px;font-size:15px;font-family:inherit;color:#111827;background:#fff">'+
     '<p data-err style="margin:9px 2px 0;min-height:18px;font-size:12.5px;color:#bd4335"></p>'+
     '<button type="submit" style="margin-top:12px;width:100%;border:0;border-radius:8px;'+
     'background:#2383e2;color:#fff;font:700 15px/1 inherit;padding:13px;cursor:pointer">들어가기</button>'+
     '<p style="margin:14px 2px 0;font-size:11.5px;color:#9ca3af;line-height:1.5">'+
     (OWNER?"이 화면은 주인 비밀번호가 필요합니다. ":"")+
     '이 기기에서는 30일 동안 다시 묻지 않습니다.</p></form>';
   document.body.appendChild(w);
   // 오류 문구는 반드시 data-err 로 집는다 — querySelector("p") 는 **첫 p** 라서
   // 위에 안내문 p 를 하나 더 두면 오류가 안내문을 덮어쓴다.
   var f=w.querySelector("form"),i=w.querySelector("input"),msg=w.querySelector("p[data-err]");
   f.addEventListener("submit",async function(e){
     e.preventDefault();
     var h=await digest(SALT+i.value);
     if(h===OH||(h===GH&&!OWNER)){set(h);location.reload();return}
     msg.textContent=h===GH?"공유용 비밀번호로는 이 화면을 볼 수 없습니다."
                           :"비밀번호가 맞지 않습니다.";
     i.value="";i.focus()});
   i.focus()}
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",show);
 else show();
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>애널리스트 집계 (뼈대)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="gtop">
  <button class="roundbtn" id="sideBtn" title="사이드바 열기/닫기" aria-label="사이드바">☰</button>
  <div class="glogo"><i>애</i><span><b>애널리스트</b> 집계</span><small class="skel">뼈대</small></div>
  <div class="vtog pagetog" role="tablist" aria-label="화면"><button id="pgDash" role="tab">업무 집계</button><button id="pgCal" role="tab">일정</button></div>
  <button class="todaybtn calonly" id="todayBtn">오늘</button>
  <button class="roundbtn calonly" id="prevBtn" title="이전 (←)" aria-label="이전">‹</button>
  <button class="roundbtn calonly" id="nextBtn" title="다음 (→)" aria-label="다음">›</button>
  <div class="calhead calonly" id="calHead"></div>
  <div class="gsp"></div>
  <label class="gsearch calonly"><input type="search" id="evSearch" placeholder="일정 검색 (기관·매니저·제목)" aria-label="일정 검색"></label>
  <div class="vtog modetog calonly" title="장부에 들어가는 일정만 볼지, 빠진 일정까지 볼지"><button id="mLedger">장부만</button><button id="mAll">전체</button></div>
  <div class="vtog calonly"><button id="vMonth">월</button><button id="vWeek">주</button><button id="vList">목록</button></div>
  <button class="adminbtn calonly" id="xlsBtn" title="기간을 정해 지원업무 장부 엑셀로 내려받습니다 (뼈대: 미구현)">⬇ 엑셀</button>
  <button class="lockbtn" id="lockBtn">🔒 편집 잠금</button>
  <button class="adminbtn" id="setBtn" title="구글 캘린더 연결·기관명 분류·애널리스트 설정">⚙ 설정</button>
</div>
<div class="scrim" id="scrim"></div>

<!-- ───── 일정 화면 ───── -->
<div class="glayout" id="calPage">
<aside class="side" id="side">
  <button class="create" id="ckBtn"><b>!</b><span id="ckLbl">확인 필요</span></button>
  <div class="mini" id="mini"></div>
  <input type="search" class="sidesearch" id="sideSearch" placeholder="애널리스트 검색">
  <div class="sidehd"><span>애널리스트 <small id="sideCnt"></small></span><button id="selAll">모두</button><button id="selNone">해제</button></div>
  <div id="sideList"></div>
  <div class="sideinfo" id="sideInfo"></div>
</aside>
<main class="mainc">
  <div class="robanner" id="roBanner"></div>
  <div class="viewbar" id="viewBar"></div>
  <div id="viewBox"></div>
</main>
</div>

<!-- ───── 업무 집계 화면 ───── -->
<main class="dashbox" id="dashBox">
  <div class="dashhead">
    <h1>업무 집계</h1>
    <span class="pill">최종 업데이트 <b id="dashUpdated">—</b></span>
    <select id="dashAn" aria-label="애널리스트 선택"><option value="">애널리스트 전체</option></select>
    <label class="chk"><input type="checkbox" id="showRetired"> 퇴사자 보기</label>
    <span class="hint2">엑셀에서 새로고침한 값</span>
    <div class="gsp"></div>
    <button class="adminbtn" id="pdfBtn" title="뼈대: 브라우저 인쇄">⬇ PDF</button>
    <button class="adminbtn" id="upBtn" title="뼈대: 미구현">⬆ 자료 올리기</button>
    <button class="adminbtn" id="clrBtn" disabled>지우기</button>
  </div>
  <div class="updbar" id="updBar"></div>
  <div class="tabbar">
    <div class="tabs" id="dashTabs"></div>
    <span class="tabhint">← → 로 넘기기</span>
  </div>
  <div id="dashBody"></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
